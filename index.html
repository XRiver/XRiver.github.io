<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRiver's Pages</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 500px at 70% -10%,rgba(40,70,140,.35),transparent 60%),
               radial-gradient(800px 480px at 10% 110%,rgba(120,60,160,.18),transparent 60%),#0b0f1a;
    color:#dbe6f5;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;text-align:center;}
  .card{max-width:520px;padding:40px 44px}
  .logo{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
    background:radial-gradient(circle at 35% 30%,#2ec7a8,#0b5a49 70%);
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 30px rgba(46,199,168,.5);}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:1px}
  p{color:#8fa2bd;font-size:14px;line-height:1.8;margin:0 0 26px}
  a.link{display:inline-block;padding:12px 26px;border-radius:22px;background:#2ec7a8;color:#06231c;
    font-weight:700;font-size:15px;text-decoration:none;transition:filter .15s}
  a.link:hover{filter:brightness(1.12)}
  .sub{margin-top:16px;font-size:12px;color:#5b6f8c}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">◈</div>
    <h1>XRiver's Pages</h1>
    <p>你好，这里是 XRiver 的页面集合。</p>
    <a class="link" href="/dyson-sphere-recipes/">戴森球计划 · 合成树助手</a>
    <div class="sub">Dyson Sphere Program · Recipe Tree Assistant</div>
  </div>
</body>
</html>
